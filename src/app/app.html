@if (selectedCar) {
  <div class="overlay" (click)="closeCar()">
    <section class="car-details" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeCar()">✕</button>

      <div class="image-side">
        <img
          [src]="'images/' + selectedCar.photo"
          [alt]="selectedCar.brand + ' ' + selectedCar.model"
        />
      </div>

      <div class="info">
        <span class="badge">{{ selectedCar.brand }}</span>
        <h2>{{ selectedCar.model }}</h2>
        <p class="price">{{ selectedCar.price }} <small>TND</small></p>

        <div class="specs">
          <div class="spec">
            <small>Power</small>
            <strong>{{ selectedCar.power }}</strong>
          </div>
          <div class="spec">
            <small>Stock</small>
            @if (selectedCar.availability > 0) {
              <strong class="in-stock">{{ selectedCar.availability }} units</strong>
            } @else {
              <strong class="out-of-stock">Out of stock</strong>
            }
          </div>
        </div>

        <h4>Description</h4>
        <p class="description">{{ selectedCar.description }}</p>
      </div>
    </section>
  </div>
}
